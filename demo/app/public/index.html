<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brew &amp; Co</title>
  <style>
    :root { --ink:#2b1d14; --accent:#8a4b22; --bg:#faf5ef; --card:#fff; --line:#e6dccf; --bad:#b3261e; --good:#1d6b3a; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:16px 24px; background:var(--ink); color:#fff; display:flex; justify-content:space-between; align-items:center; }
    main { max-width:920px; margin:24px auto; padding:0 16px; display:grid; gap:20px; grid-template-columns:1fr 1fr; }
    @media (max-width:720px) { main { grid-template-columns:1fr; } }
    section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
    h2 { margin:0 0 10px; font-size:16px; }
    input, button { font:inherit; padding:8px 10px; border-radius:6px; border:1px solid var(--line); }
    button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .row { display:flex; gap:8px; margin:6px 0; align-items:center; }
    .row.grow input { flex:1; }
    .product { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed var(--line); }
    .error { color:var(--bad); min-height:1.3em; }
    .ok { color:var(--good); }
    dl { display:grid; grid-template-columns:1fr auto; gap:4px 12px; margin:10px 0; }
    dt { color:#6b5848; } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
    .total dt, .total dd { font-weight:700; border-top:1px solid var(--line); padding-top:6px; }
    .hint { color:#6b5848; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <strong>Brew &amp; Co</strong>
    <span data-testid="session-user">Not signed in</span>
  </header>

  <main>
    <section id="login-section">
      <h2>Sign in</h2>
      <form data-testid="login-form">
        <div class="row grow"><input data-testid="login-email" type="email" placeholder="email" autocomplete="username" /></div>
        <div class="row grow"><input data-testid="login-password" type="password" placeholder="password" autocomplete="current-password" /></div>
        <div class="row"><button data-testid="login-submit" type="submit">Sign in</button></div>
        <div class="error" data-testid="login-error" role="alert"></div>
        <p class="hint">Demo user: ada@brewandco.test / espresso123</p>
      </form>
    </section>

    <section>
      <h2>Shop</h2>
      <div id="products" data-testid="product-list"></div>
    </section>

    <section style="grid-column: 1 / -1">
      <h2>Your cart</h2>
      <div id="cart-items" data-testid="cart-items"><span class="hint">Sign in to start shopping.</span></div>
      <div class="row grow">
        <input data-testid="coupon-input" placeholder="Discount code" />
        <button data-testid="coupon-apply" type="button">Apply</button>
      </div>
      <div class="error" data-testid="coupon-error" role="alert"></div>
      <dl>
        <dt>Subtotal</dt><dd data-testid="cart-subtotal">$0.00</dd>
        <dt>Discount</dt><dd data-testid="cart-discount">−$0.00</dd>
        <dt>Shipping</dt><dd data-testid="cart-shipping">$0.00</dd>
        <dt>Tax (8%)</dt><dd data-testid="cart-tax">$0.00</dd>
        <div class="total" style="display:contents"><dt>Total</dt><dd data-testid="cart-total">$0.00</dd></div>
      </dl>
      <button data-testid="checkout-submit" type="button" disabled>Place order</button>
      <div class="ok" data-testid="order-confirmation" role="status"></div>
    </section>
  </main>

  <script>
    let token = null;
    const $ = (id) => document.querySelector(`[data-testid="${id}"]`);
    const money = (cents) => `$${(cents / 100).toFixed(2)}`;

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error ? json.error.message : 'Request failed');
      return json.data;
    }

    function renderCart(cart) {
      const list = $('cart-items');
      list.innerHTML = cart.items.length
        ? cart.items.map((i) => `<div class="product"><span>${i.name} × ${i.qty}</span><span>${money(i.lineTotal)}</span></div>`).join('')
        : '<span class="hint">Your cart is empty.</span>';
      const t = cart.totals;
      $('cart-subtotal').textContent = money(t.subtotal);
      $('cart-discount').textContent = `−${money(t.discount)}`;
      $('cart-shipping').textContent = money(t.shipping);
      $('cart-tax').textContent = money(t.tax);
      $('cart-total').textContent = money(t.total);
      $('checkout-submit').disabled = cart.items.length === 0;
    }

    async function loadProducts() {
      const products = await api('GET', '/api/products');
      $('product-list').innerHTML = products.map((p) =>
        `<div class="product"><span>${p.name} — ${money(p.price)}</span>` +
        `<button data-testid="product-${p.sku}-add" type="button" data-sku="${p.sku}">Add</button></div>`).join('');
    }

    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('login-error').textContent = '';
      $('login-submit').disabled = true;
      try {
        const data = await api('POST', '/api/auth/login', { email: $('login-email').value, password: $('login-password').value });
        token = data.token;
        $('session-user').textContent = `Signed in as ${data.user.name}`;
        renderCart(await api('GET', '/api/cart'));
      } catch (err) {
        $('login-error').textContent = err.message;
      } finally {
        $('login-submit').disabled = false;
      }
    });

    $('product-list').addEventListener('click', async (event) => {
      const sku = event.target.dataset && event.target.dataset.sku;
      if (!sku) return;
      $('coupon-error').textContent = '';
      try { renderCart(await api('POST', '/api/cart/items', { sku, qty: 1 })); }
      catch (err) { $('coupon-error').textContent = err.message; }
    });

    $('coupon-apply').addEventListener('click', async () => {
      $('coupon-error').textContent = '';
      try { renderCart(await api('POST', '/api/cart/coupon', { code: $('coupon-input').value })); }
      catch (err) { $('coupon-error').textContent = err.message; }
    });

    $('checkout-submit').addEventListener('click', async () => {
      $('order-confirmation').textContent = '';
      try {
        const order = await api('POST', '/api/checkout');
        $('order-confirmation').textContent = `Order ${order.id} placed — total ${money(order.totals.total)}`;
        renderCart(await api('GET', '/api/cart'));
      } catch (err) { $('coupon-error').textContent = err.message; }
    });

    loadProducts();
  </script>
</body>
</html>
